services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  command:
    build:
      dockerfile: docker/commandservice.Dockerfile
      context: .
    ports:
      - "3000:3000"
    depends_on:
      - kafka
    environment:
      KAFKA_BROKERS: "kafka:29092"

  query:
    build:
      dockerfile: docker/queryservice.Dockerfile
      context: .
    ports:
      - "3001:3001"
    # volumes:
    #   - chat_read:/app/db
    depends_on:
      - kafka
    environment:
      KAFKA_BROKERS: "kafka:29092"
# volumes:
#   chat_read:
